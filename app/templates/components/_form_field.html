{# One form field with label, help text and errors. Params: field. Textareas span both grid columns. #}
<div class="{% if field.widget_type == 'textarea' %}md:col-span-2{% endif %}">
  <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-200">
    {{ field.label }}{% if field.field.required %} <span class="text-teal-300" aria-hidden="true">*</span>{% endif %}
  </label>
  <div class="mt-2">{{ field }}</div>
  {% if field.help_text %}
    <p id="{{ field.auto_id }}_helptext" class="mt-2 text-xs text-slate-400">{{ field.help_text }}</p>
  {% endif %}
  {% for error in field.errors %}
    <p class="mt-2 flex items-start gap-1.5 text-sm text-red-300"><i class="bi bi-exclamation-circle mt-0.5" aria-hidden="true"></i>{{ error }}</p>
  {% endfor %}
</div>
